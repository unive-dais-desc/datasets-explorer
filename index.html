<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Datasets Explorer</title>
<meta name="description" content="Dataset di interesse ambientale depositati dai gruppi di ricerca del DAIS, Università Ca’ Foscari Venezia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,500;0,600;1,400;1,500&display=swap">
<style>
:root{
  --paper:#EEF3F4; --surface:#FAFCFC; --ink:#0A3F51; --muted:#56717B; --rule:#CBDADE;
  --accent:#0F597B; --accent-soft:#DDEBEF; --mark:#F3E3A2;
  --r-zenodo:#1D6676; --r-pangaea:#4F8A45; --r-figshare:#CFA530; --r-unive:#A3243B;
  --r-dryad:#6B5B95; --r-dataverse:#C2410C; --r-other:#8A968E;
  --desc-grad:linear-gradient(90deg,#CFA530 0%,#A5AE48 25%,#6E9A4E 50%,#1D6676 75%,#0F597B 100%);
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0B1D25; --surface:#10262F; --ink:#E1ECEF; --muted:#93AEB7; --rule:#23424D;
    --accent:#6FB6D4; --accent-soft:#16384A; --mark:#5A4B12;
    --r-zenodo:#4FB0C2; --r-pangaea:#9CC36A; --r-figshare:#E3BB4A; --r-unive:#E0697E;
    --r-dryad:#A895D6; --r-dataverse:#FB8B5B; --r-other:#8A968E;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0B1D25; --surface:#10262F; --ink:#E1ECEF; --muted:#93AEB7; --rule:#23424D;
  --accent:#6FB6D4; --accent-soft:#16384A; --mark:#5A4B12;
  --r-zenodo:#4FB0C2; --r-pangaea:#9CC36A; --r-figshare:#E3BB4A; --r-unive:#E0697E;
  --r-dryad:#A895D6; --r-dataverse:#FB8B5B; --r-other:#8A968E;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
a{color:var(--accent)}
.mono{font-family:var(--mono)}
[hidden]{display:none!important}
#src{font-size:11.5px;color:var(--muted)}

/* ---------- header (come Herbarium) */
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
header.top{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:10px 18px 12px;border-bottom:1px solid var(--rule);background:var(--surface)}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--desc-grad)}
.logo{display:block;height:52px;width:104px;object-fit:contain;overflow:hidden;background:#fff;border-radius:4px;padding:2px 4px}
.titles{display:grid;gap:1px}
header.top h1{margin:0;font-family:var(--sans);font-weight:700;font-size:24px;letter-spacing:.1px;line-height:1.1}
header.top .sub{color:var(--muted);font-size:13px}
header.top .counts{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
header.top .counts b{color:var(--ink);font-weight:500}
header.top button{white-space:nowrap;flex:none}
.langbtn{font-weight:600;font-size:12px;letter-spacing:.06em;padding:5px 9px;min-width:38px}

/* ---------- colonna sinistra scorrevole */
.main{display:grid;grid-template-columns:minmax(300px,380px) 1fr;min-height:0}
aside{border-right:1px solid var(--rule);background:var(--surface);min-height:0;overflow:auto;scrollbar-width:thin}
.filters{padding:14px 16px;border-bottom:1px solid var(--rule);display:grid;gap:10px}
.field{display:grid;gap:4px}
.field label,.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
input[type=search],input[type=number],select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:6px 8px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.years{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.field label.chip{text-transform:none;letter-spacing:0;font-size:12px;color:var(--ink);font-weight:400}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--rule);border-radius:999px;padding:3px 10px 3px 7px;cursor:pointer;user-select:none;background:var(--paper)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.chip:has(input:not(:checked)){opacity:.45}
.chip:has(input:not(:checked)) .dot{background:transparent!important;border:1.5px solid currentColor}
.chip:has(input:focus-visible){outline:2px solid var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:12.5px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.55;cursor:progress}
#reload{background:var(--accent);color:var(--surface);border-color:var(--accent)}
#reload:hover{filter:brightness(1.1);color:var(--surface)}

/* barra degli anni */
.strata{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:1px;height:58px;align-items:end;touch-action:none;user-select:none;cursor:crosshair;overflow:hidden;margin-top:2px}
.yc{min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;background:none;border:0;border-radius:2px 2px 0 0;padding:0;cursor:inherit;position:relative}
.yc:hover{border:0}
.yc .stack{display:flex;flex-direction:column-reverse;width:100%;border-radius:2px 2px 0 0;overflow:hidden;transition:opacity .15s}
.yc .seg{display:block;width:100%}
.yc.out .stack{opacity:.2}
.yc.sel{background:color-mix(in srgb,var(--accent-soft) 70%,transparent)}
.yc.empty::after{content:"";position:absolute;left:15%;right:15%;bottom:0;height:2px;background:var(--rule)}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);border-top:1px solid var(--rule);padding-top:2px}
.readout{font-size:12px;color:var(--muted);min-height:1.45em}
.readout b{color:var(--ink);font-weight:500}

/* pannello statistiche (come Herbarium) */
.panel{padding:14px 16px 24px;display:grid;gap:14px;align-content:start}
.panel h3,.dsec h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
.note{font-size:12.5px;color:var(--muted)}
.bars{display:grid;gap:4px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12.5px;cursor:pointer;background:none;border:0;padding:0;text-align:left;color:var(--ink);width:100%}
.bar:hover{color:var(--accent)}
.bar .t{position:relative;padding:3px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar .t span{position:relative}
.bar .t::before{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--accent-soft);border-left:3px solid var(--r-pangaea);border-radius:2px}
.bar .n{font-family:var(--mono);font-size:12px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.bar[aria-pressed="true"] .t{font-weight:600}

/* ---------- risultati */
.results{min-height:0;overflow:auto;padding:14px 22px 40px}
.rhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.rhead h2{margin:0;font-family:var(--serif);font-weight:600;font-size:19px}
.list{display:grid}
.ds{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:11px 4px 12px;border-bottom:1px solid var(--rule);cursor:pointer}
.ds:hover{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.ds[aria-current="true"]{background:var(--accent-soft)}
.ds .tt{all:unset;cursor:pointer;font-family:var(--serif);font-weight:500;font-size:16.5px;line-height:1.3;text-wrap:pretty}
.ds .tt:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.ds:hover .tt{color:var(--accent)}
.box{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--rule);border-radius:3px;padding:0 5px;align-self:start;margin-top:3px;white-space:nowrap}
.ds .au,.ds .meta,.ds .snip,.ds .kws{grid-column:1/-1}
.ds .au{font-size:12.5px;color:var(--ink);line-height:1.45}
.ds .au b,.dau b{font-weight:600}
.ds .meta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;font-size:12px;color:var(--muted)}
.repo{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.repo .dot{width:9px;height:9px;border-radius:50%;flex:none}
.new{font-size:11px;color:var(--r-pangaea);border:1px solid currentColor;border-radius:3px;padding:0 5px}
.snip{font-size:12.5px;color:var(--muted);max-width:90ch;margin:2px 0 0}
.kws{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--paper);border:1px solid var(--rule)}
.tag[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.more{justify-self:start;margin-top:14px}
.empty{color:var(--muted);font-size:13px;padding:8px 0}

/* ---------- scheda del dataset */
.scrim{position:fixed;inset:0;background:rgba(6,30,40,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--surface);z-index:50;display:grid;grid-template-rows:auto 1fr;border-left:1px solid var(--rule);box-shadow:-10px 0 30px rgba(6,30,40,.16);transform:translateX(102%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none;visibility:visible;transition:transform .22s ease}
.dbar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--rule)}
.dbar .pos{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:auto}
.dbar button{min-width:32px;font-size:15px;line-height:1;padding:5px 8px}
.dbody{overflow:auto;padding:16px 20px 32px;display:grid;gap:16px;align-content:start}
.dbody h2{margin:6px 0 0;font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.25;text-wrap:balance}
.dkick{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.dact{display:flex;flex-wrap:wrap;gap:8px}
.dact a.primary{display:inline-flex;align-items:center;font-size:12.5px;padding:5px 10px;border-radius:4px;background:var(--accent);color:var(--surface);border:1px solid var(--accent);text-decoration:none;font-weight:500}
.dact a.primary:hover{filter:brightness(1.1)}
.cite{font-family:var(--serif);font-size:14.5px;line-height:1.55;background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:3px;padding:9px 11px;overflow-wrap:anywhere}
.dau{display:grid;gap:3px}
.person{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:13px;cursor:pointer;text-align:left}
.person .linkbtn{color:var(--ink);font-size:14px;text-decoration-color:var(--rule);text-underline-offset:3px}
.person .linkbtn:hover{color:var(--accent);text-decoration-color:currentColor}
.orcid{font-family:var(--mono);font-size:11.5px;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.orcid::before{content:"iD";font-family:var(--sans);font-size:9px;font-weight:700;color:#fff;background:#A6CE39;border-radius:50%;width:14px;height:14px;display:grid;place-items:center}
.abstract{font-family:var(--serif);font-size:15px;line-height:1.6;max-width:70ch}
.abstract.clamp{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
dl.label{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;padding:9px 11px;font-size:12.5px;background:var(--paper);border:1px solid var(--rule);border-radius:3px}
dl.label dt{color:var(--muted)}
dl.label dd{margin:0;overflow-wrap:anywhere}
.dsec .kws button{cursor:pointer}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:2000;background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:5px;font-size:13px;max-width:min(520px,calc(100% - 32px));box-shadow:0 6px 20px rgba(0,0,0,.18)}
.toast.err{background:#B42318;color:#fff}

@media (max-width:760px){
  .logo{height:40px;width:80px}
  .app{height:auto}
  .main{grid-template-columns:minmax(0,1fr)}
  aside{border-right:0;overflow:visible}
  .results{overflow:visible;padding:14px 14px 40px}
  header.top .counts{margin-left:0}
  .dbody{padding:14px 16px 32px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
/* =====================================================================
   CONFIGURAZIONE
   ===================================================================== */
// URL del deployment dell'App Web di Google Apps Script (termina con /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbwIEbL6hTAWBOPpslML7_FmsKw4lZuoDSCkCFdPNKFNNgNN9V_BbU31qRGT_20SJyCN/exec';
// Facoltativo: copia statica del catalogo nel repository (es. 'datasets.json'), usata se l'API non risponde
const STATIC_FALLBACK_URL = '';
const CACHE_KEY = 'dais-datasets-explorer-v2';

const REPO_COLORS = {
  'zenodo':'--r-zenodo', 'pangaea':'--r-pangaea', 'figshare':'--r-figshare',
  'datarepository unive':'--r-unive', 'dryad':'--r-dryad', 'harvard dataverse':'--r-dataverse'
};

/* =====================================================================
   TESTI
   ===================================================================== */
const I18N = {
  it:{
    title:'Datasets Explorer',
    subtitle:'Dataset di interesse ambientale depositati dai gruppi di ricerca · DAIS, Ca’ Foscari University of Venice',
    search:'Cerca', searchPh:'Titolo, autore, parola chiave, abstract, DOI…',
    repository:'Repository', year:'Anno di pubblicazione', from:'Dal', to:'Al',
    authors:'Autore DAIS', keyword:'Parola chiave',
    allAuthors:'Tutti gli autori', allKw:'Tutte le parole chiave',
    newOnly:'Solo inserimenti recenti', sort:'Ordina per', sortAuto:'Pertinenza alla ricerca',
    sortNew:'Anno, dal più recente', sortOld:'Anno, dal meno recente', sortAz:'Titolo A–Z',
    reset:'Azzera filtri', csv:'Esporta CSV', bib:'Esporta BibTeX', share:'Copia link', reload:'Aggiorna dati dal foglio',
    loading:'Caricamento dei dati…', datasets:'dataset', repos:'repository', people:'autori DAIS',
    topKw:'Parole chiave più frequenti', topAu:'Autori DAIS più presenti',
    sortedBy:{rel:'ordinati per pertinenza', new:'dal più recente', old:'dal meno recente', az:'in ordine alfabetico'},
    showMore:n=>`Mostra altri ${n}`, noMatch:'Nessun dataset corrisponde ai filtri. Prova a toglierne uno o a usare un termine più generale.',
    yearHover:(y,n)=>`${y}: ${n} dataset`, yearsSel:(a,b)=>a===b?`Anno ${a}`:`Anni ${a}–${b}`, yearHint:'Tocca un anno o trascina per scegliere un intervallo',
    openRepo:'Apri nel repository', copyCite:'Copia citazione', copyBib:'Copia BibTeX', copied:'Copiato negli appunti',
    copyFail:'Copia non riuscita: seleziona il testo e copialo a mano', linkCopied:'Link alla ricerca copiato',
    cite:'Come citare', daisAuthors:'Autori DAIS', abstract:'Descrizione', readMore:'Leggi tutto', readLess:'Riduci',
    keywords:'Parole chiave', ids:'Identificativi', doi:'DOI', curVer:'Versione', related:'DOI collegati',
    id:'ID catalogo', isNew:'Nuovo', pos:(i,n)=>`${i} / ${n}`, noAbstract:'Descrizione non disponibile.',
    readFail:m=>`Lettura dei dati non riuscita: ${m}. Riprova con “Aggiorna dati dal foglio”.`, notConfigured:'Indirizzo API non configurato: imposta API_URL in index.html.',
    offline:'Mostro la copia salvata: il foglio non risponde.', updated:'Dati aggiornati', readAt:'letto alle', locale:'it-IT',
    exported:n=>`Esportati ${n} dataset`, close:'Chiudi', prev:'Precedente', next:'Successivo'
  },
  en:{
    title:'Datasets Explorer',
    subtitle:'Environmental datasets deposited by research groups · DAIS, Ca’ Foscari University of Venice',
    search:'Search', searchPh:'Title, author, keyword, abstract, DOI…',
    repository:'Repository', year:'Publication year', from:'From', to:'To',
    authors:'DAIS author', keyword:'Keyword',
    allAuthors:'All authors', allKw:'All keywords',
    newOnly:'Recent additions only', sort:'Sort by', sortAuto:'Search relevance',
    sortNew:'Year, newest first', sortOld:'Year, oldest first', sortAz:'Title A–Z',
    reset:'Reset filters', csv:'Export CSV', bib:'Export BibTeX', share:'Copy link', reload:'Reload data from sheet',
    loading:'Loading data…', datasets:'datasets', repos:'repositories', people:'DAIS authors',
    topKw:'Most frequent keywords', topAu:'Most frequent DAIS authors',
    sortedBy:{rel:'sorted by relevance', new:'newest first', old:'oldest first', az:'alphabetical'},
    showMore:n=>`Show ${n} more`, noMatch:'No dataset matches the filters. Try removing one or using a broader term.',
    yearHover:(y,n)=>`${y}: ${n} ${n===1?'dataset':'datasets'}`, yearsSel:(a,b)=>a===b?`Year ${a}`:`Years ${a}–${b}`, yearHint:'Tap a year or drag to choose a range',
    openRepo:'Open in repository', copyCite:'Copy citation', copyBib:'Copy BibTeX', copied:'Copied to clipboard',
    copyFail:'Copy failed: select the text and copy it manually', linkCopied:'Link to this search copied',
    cite:'How to cite', daisAuthors:'DAIS authors', abstract:'Description', readMore:'Read more', readLess:'Show less',
    keywords:'Keywords', ids:'Identifiers', doi:'DOI', curVer:'Version', related:'Related DOIs',
    id:'Catalogue ID', isNew:'New', pos:(i,n)=>`${i} / ${n}`, noAbstract:'No description available.',
    readFail:m=>`Could not read the data: ${m}. Try “Reload data from sheet”.`, notConfigured:'API address not configured: set API_URL in index.html.',
    offline:'Showing the saved copy: the sheet is not responding.', updated:'Data updated', readAt:'read at', locale:'en-GB',
    exported:n=>`Exported ${n} datasets`, close:'Close', prev:'Previous', next:'Next'
  }
};
let LANG = 'it';
try { LANG = localStorage.getItem('dais-lang') || 'it'; } catch(e) {}
const T = k => I18N[LANG][k];

/* =====================================================================
   STATO E UTILITÀ
   ===================================================================== */
let DATA = [], BY_ID = {}, YMIN = 0, YMAX = 0, REPOS = [], META = null;
const S = { q:'', repoOff:new Set(), au:'', kw:'', y0:null, y1:null, onlyNew:false, sort:'auto', limit:50, open:null };
let RESULTS = [];

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const flat = s => ' ' + norm(s).replace(/[^\p{L}\p{N}]+/gu, ' ').trim() + ' ';
const terms = q => [...new Set(flat(q).trim().split(' ').filter(Boolean))];
const has = (hay, t) => hay.includes(' ' + t);
const repoVar = r => `var(${REPO_COLORS[norm(r)] || '--r-other'})`;
const fmt = n => n.toLocaleString(T('locale'));

/* =====================================================================
   CARICAMENTO
   ===================================================================== */
function readCache(){ try { const s = localStorage.getItem(CACHE_KEY); return s ? JSON.parse(s) : null; } catch(e){ return null; } }
function writeCache(p){ try { localStorage.setItem(CACHE_KEY, JSON.stringify(p)); } catch(e){} }

async function getJSON(url){
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 30000);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data && data.error) throw new Error(data.error);
    return data;
  } finally { clearTimeout(t); }
}

async function load(force){
  if (window.DAIS_EMBEDDED_DATA) { $('reload').hidden = true; init(window.DAIS_EMBEDDED_DATA); return; }
  const cached = force ? null : readCache();
  if (cached && cached.records && !DATA.length) init(cached);
  if (!API_URL && !STATIC_FALLBACK_URL) { if (!cached) showFail(T('notConfigured')); return; }
  $('reload').disabled = true;
  try {
    if (!API_URL) throw new Error('API_URL');
    const p = await getJSON(API_URL + '?action=getData&v=' + encodeURIComponent(cached ? cached.version : ''));
    if (!p.notModified) { writeCache(p); init(p); if (cached || force) toast(T('updated')); }
  } catch (err) {
    let ok = false;
    if (STATIC_FALLBACK_URL) { try { const p = await getJSON(STATIC_FALLBACK_URL); writeCache(p); init(p); ok = true; } catch(e){} }
    if (!ok) { if (DATA.length) toast(T('offline'), 'err'); else showFail(err.message); }
  } finally { $('reload').disabled = false; }
}
function showFail(msg){ $('list').innerHTML = `<p class="empty">${esc(T('readFail')(msg))}</p>`; $('rcount').textContent = ''; }

function init(payload){
  META = payload;
  DATA = (payload.records || []).map(prep);
  BY_ID = Object.fromEntries(DATA.map(r => [r.id, r]));
  const ys = DATA.map(r => r.year).filter(Boolean);
  YMIN = Math.min(...ys); YMAX = Math.max(...ys);
  const rc = {}; DATA.forEach(r => rc[r.repo] = (rc[r.repo]||0) + 1);
  REPOS = Object.keys(rc).sort((a,b) => rc[b]-rc[a]);
  ['y0','y1'].forEach(id => { $(id).min = YMIN; $(id).max = YMAX; });
  $('y0').placeholder = YMIN; $('y1').placeholder = YMAX;
  readHash();
  render();
  renderStatus();
  if (S.open && BY_ID[S.open]) openDetail(S.open, true);
}

function prep(r){
  r.kw = r.kw || []; r.dais = r.dais || []; r.orcid = r.orcid || {}; r.versions = r.versions || [];
  const m = String(r.cite||'').match(/^(.*?)\s*\((\d{4})\)/);
  r._authors = m ? m[1].split(/\s*;\s*/).filter(Boolean) : r.dais.slice();
  const dtok = r.dais.map(d => flat(d).trim().split(' '));
  r._isDais = r._authors.map(a => isDais(a, dtok));
  r._t = flat(r.title); r._kw = flat(r.kw.join(' '));
  r._au = flat(r._authors.join(' ') + ' ' + r.dais.join(' '));
  r._ab = flat(r.abstract);
  r._h = r._t + r._kw + r._au + r._ab + flat(r.doi) + flat(r.id) + flat(r.repo);
  r._new = /^nuov/i.test(r.status || '');
  return r;
}

/* Riconosce gli autori DAIS nella lista completa della citazione:
   "Stenni, Barbara", "Barbara Stenni", "Stoll, Nicolas" ↔ "Stoll Nicolas Angelo" */
function isDais(citeName, dtok){
  const c = flat(citeName).trim().split(' '), cs = new Set(c);
  return dtok.some(d => {
    if (d.length < 2 || !cs.has(d[0])) return false;
    if (!cs.has(d[1]) && !c.some(t => t.length <= 2 && t !== d[0] && t[0] === d[1][0])) return false;
    if (c.length >= 3 && d.length >= 3) return c.length === d.length && d.every(t => cs.has(t));
    return true;
  });
}

/* =====================================================================
   FILTRI
   ===================================================================== */
function passes(r, skip, qt){
  if (qt.length && !qt.every(t => has(r._h, t))) return false;
  if (skip !== 'repo' && S.repoOff.has(r.repo)) return false;
  if (skip !== 'year' && S.y0 != null && !(r.year >= S.y0 && r.year <= S.y1)) return false;
  if (skip !== 'au' && S.au && !r.dais.includes(S.au)) return false;
  if (skip !== 'kw' && S.kw && !r.kw.includes(S.kw)) return false;
  if (skip !== 'new' && S.onlyNew && !r._new) return false;
  return true;
}
function score(r, qt){
  let s = 0;
  qt.forEach(t => {
    if (has(r._t, t)) s += r._t.includes(' ' + t + ' ') ? 8 : 5;
    if (has(r._kw, t)) s += 4;
    if (has(r._au, t)) s += 4;
    if (has(r._ab, t)) s += 1;
  });
  return s;
}
function sortKey(qt){ return S.sort === 'auto' ? (qt.length ? 'rel' : 'new') : S.sort; }
function compute(){
  const qt = terms(S.q);
  const res = DATA.filter(r => passes(r, null, qt));
  const k = sortKey(qt);
  if (k === 'rel') { res.forEach(r => r._s = score(r, qt)); res.sort((a,b) => b._s - a._s || (b.year||0) - (a.year||0)); }
  else if (k === 'new') res.sort((a,b) => (b.year||0) - (a.year||0) || a.title.localeCompare(b.title));
  else if (k === 'old') res.sort((a,b) => (a.year||0) - (b.year||0) || a.title.localeCompare(b.title));
  else res.sort((a,b) => a.title.localeCompare(b.title, undefined, { sensitivity:'base' }));
  return { res, qt };
}
function facet(key, getter, qt){
  const c = new Map();
  DATA.forEach(r => { if (passes(r, key, qt)) getter(r).forEach(v => c.set(v, (c.get(v)||0) + 1)); });
  return c;
}

/* =====================================================================
   RENDER
   ===================================================================== */
function render(){
  const { res, qt } = compute();
  RESULTS = res;
  renderCounts();
  renderRepo(qt);
  renderStrata(qt);
  renderSelects(qt);
  renderPanel();
  renderList(qt);
  writeHash();
}

/* Totali fissi dell'intero archivio: non dipendono dai filtri */
function renderCounts(){
  const au = new Set(); DATA.forEach(r => r.dais.forEach(a => au.add(a)));
  $('counts').innerHTML =
    `<span><b>${fmt(DATA.length)}</b> ${T('datasets')}</span>` +
    `<span><b>${REPOS.length}</b> ${T('repos')}</span>` +
    `<span><b>${au.size}</b> ${T('people')}</span>`;
}
function renderStatus(){
  if (!META) return;
  const when = META.updated ? new Date(META.updated).toLocaleTimeString(T('locale'), { hour:'2-digit', minute:'2-digit' }) : '';
  $('src').textContent = [META.spreadsheetName, META.sheetName].filter(Boolean).join(' › ') + (when ? ' · ' + T('readAt') + ' ' + when : '');
}

function renderRepo(qt){
  const c = facet('repo', r => [r.repo], qt);
  $('fRepo').innerHTML = REPOS.map(rp => `<label class="chip"><input type="checkbox" data-repo="${esc(rp)}" ${S.repoOff.has(rp)?'':'checked'}><span class="dot" style="background:${repoVar(rp)}"></span><span>${esc(rp)}</span><span class="n">${c.get(rp)||0}</span></label>`).join('');
}

function fillSelect(el, counts, allLabel, current, sortFn){
  let items = [...counts.entries()];
  if (current && !counts.has(current)) items.push([current, 0]);
  items.sort(sortFn);
  el.innerHTML = `<option value="">${esc(allLabel)}</option>` + items.map(([v,n]) => `<option value="${esc(v)}">${esc(v)} (${n})</option>`).join('');
  el.value = current || '';
}
function renderSelects(qt){
  const byCount = (a,b) => b[1]-a[1] || a[0].localeCompare(b[0]);
  const byName = (a,b) => a[0].localeCompare(b[0]);
  fillSelect($('au'), facet('au', r => r.dais, qt), T('allAuthors'), S.au, byName);
  fillSelect($('kw'), facet('kw', r => r.kw, qt), T('allKw'), S.kw, byCount);
  $('fNew').checked = S.onlyNew;
  $('sort').value = S.sort;
  $('y0').value = S.y0 != null ? S.y0 : '';
  $('y1').value = S.y1 != null ? S.y1 : '';
}

/* ---- barra degli anni */
let drag = null, PER = {}, TOT = {};
function renderStrata(qt){
  PER = {}; TOT = {};
  DATA.forEach(r => { if (r.year && passes(r, 'year', qt)) { (PER[r.year] = PER[r.year] || {})[r.repo] = (PER[r.year][r.repo]||0) + 1; } });
  let max = 1;
  for (let y = YMIN; y <= YMAX; y++) { TOT[y] = Object.values(PER[y]||{}).reduce((a,b)=>a+b,0); max = Math.max(max, TOT[y]); }
  let cols = '';
  for (let y = YMIN; y <= YMAX; y++) {
    const n = TOT[y], inSel = S.y0 == null || (y >= S.y0 && y <= S.y1);
    const h = n ? Math.max(5, Math.round(n / max * 100)) : 0;
    const segs = REPOS.filter(rp => PER[y] && PER[y][rp]).map(rp => `<span class="seg" style="height:${PER[y][rp]/n*100}%;background:${repoVar(rp)}"></span>`).join('');
    cols += `<button type="button" class="yc${inSel?'':' out'}${n?'':' empty'}${S.y0!=null&&inSel?' sel':''}" data-y="${y}" aria-label="${esc(T('yearHover')(y, n))}" aria-pressed="${S.y0!=null&&inSel}"><span class="stack" style="height:${h}%">${segs}</span></button>`;
  }
  $('strata').innerHTML = cols;
  const mid = Math.round((YMIN + YMAX) / 2);
  $('axis').innerHTML = `<span>${YMIN}</span><span>${mid}</span><span>${YMAX}</span>`;
  setReadout();
}
function setReadout(hoverY){
  const el = $('readout');
  if (hoverY != null) {
    const p = PER[hoverY] || {};
    const parts = REPOS.filter(r => p[r]).map(r => `${esc(r)} ${p[r]}`).join(', ');
    el.innerHTML = `<b>${esc(T('yearHover')(hoverY, TOT[hoverY] || 0))}</b>${parts ? ' · ' + parts : ''}`;
  } else if (S.y0 != null) el.innerHTML = `<b>${esc(T('yearsSel')(S.y0, S.y1))}</b>`;
  else el.textContent = T('yearHint');
}
function yearAt(e){
  const r = $('strata').getBoundingClientRect(), n = YMAX - YMIN + 1;
  return YMIN + Math.min(n - 1, Math.max(0, Math.floor((e.clientX - r.left) / r.width * n)));
}
function paintSel(){
  $('strata').querySelectorAll('.yc').forEach(b => {
    const y = +b.dataset.y, inSel = S.y0 == null || (y >= S.y0 && y <= S.y1);
    b.classList.toggle('out', !inSel); b.classList.toggle('sel', S.y0 != null && inSel);
  });
}
function setupStrata(){
  const el = $('strata');
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0 || !DATA.length) return;
    e.preventDefault();
    const y = yearAt(e); drag = { a: y, moved: false, prev: [S.y0, S.y1] };
    el.setPointerCapture(e.pointerId);
    S.y0 = S.y1 = y; paintSel(); setReadout();
  });
  el.addEventListener('pointermove', e => {
    if (!DATA.length) return;
    const y = yearAt(e);
    if (!drag) { if (e.pointerType === 'mouse') setReadout(y); return; }
    if (y !== drag.a) drag.moved = true;
    S.y0 = Math.min(drag.a, y); S.y1 = Math.max(drag.a, y); paintSel(); setReadout();
  });
  const end = () => {
    if (!drag) return;
    if (!drag.moved && drag.prev[0] === drag.a && drag.prev[1] === drag.a) S.y0 = S.y1 = null;
    drag = null; S.limit = 50; render();
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('pointerleave', () => { if (!drag) setReadout(); });
  el.addEventListener('keydown', e => {
    const b = e.target.closest('.yc'); if (!b || (e.key !== 'Enter' && e.key !== ' ')) return;
    e.preventDefault(); const y = +b.dataset.y;
    if (e.shiftKey && S.y0 != null) { S.y0 = Math.min(S.y0, y); S.y1 = Math.max(S.y1, y); }
    else if (S.y0 === y && S.y1 === y) S.y0 = S.y1 = null;
    else S.y0 = S.y1 = y;
    S.limit = 50; render(); el.querySelector(`[data-y="${y}"]`).focus();
  });
}

/* ---- pannello con le classifiche (come le famiglie nell'Erbario) */
function topBars(title, kind, counts, current){
  const top = [...counts.entries()].sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0])).slice(0, 10);
  if (!top.length) return '';
  const max = top[0][1];
  return `<div><h3>${esc(title)}</h3><div class="bars">${top.map(([v,n]) => `<button type="button" class="bar" data-set="${kind}" data-v="${esc(v)}" aria-pressed="${current===v}"><span class="t" style="--w:${(n/max*100).toFixed(1)}%"><span>${esc(v)}</span></span><span class="n">${fmt(n)}</span></button>`).join('')}</div></div>`;
}
function renderPanel(){
  const kw = new Map(), au = new Map();
  RESULTS.forEach(r => { r.kw.forEach(k => kw.set(k, (kw.get(k)||0)+1)); r.dais.forEach(a => au.set(a, (au.get(a)||0)+1)); });
  $('panel').innerHTML = RESULTS.length ? topBars(T('topKw'), 'kw', kw, S.kw) + topBars(T('topAu'), 'au', au, S.au) : '';
}

/* ---- elenco dei risultati */
function hl(text, qt){
  const s = esc(text);
  const parts = qt.filter(t => t.length > 1).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!parts.length) return s;
  return s.replace(new RegExp('(^|[^\\p{L}\\p{N}&#;])(' + parts.join('|') + ')', 'giu'), '$1<mark>$2</mark>');
}
function snippet(r, qt){
  if (!qt.length || !r.abstract || qt.every(t => has(r._t, t))) return '';
  const t = qt.find(t => has(r._ab, t)); if (!t) return '';
  const plain = r.abstract.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const m = new RegExp('(^|[^\\p{L}\\p{N}])' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'iu').exec(plain);
  if (!m) return '';
  const i = m.index + m[1].length, a = Math.max(0, i - 70), b = Math.min(r.abstract.length, i + 140);
  return `<p class="snip">${a?'…':''}${hl(r.abstract.slice(a, b), qt)}${b < r.abstract.length?'…':''}</p>`;
}
function authorsHtml(r, qt){
  return r._authors.map((a, i) => r._isDais[i] ? `<b>${hl(a, qt)}</b>` : hl(a, qt)).join('; ');
}
function renderList(qt){
  const n = RESULTS.length;
  $('rcount').textContent = `${fmt(n)} ${T('datasets')}`;
  $('rnote').textContent = n ? T('sortedBy')[sortKey(qt)] : '';
  if (!n) { $('list').innerHTML = `<p class="empty">${esc(T('noMatch'))}</p>`; $('more').hidden = true; return; }
  $('list').innerHTML = RESULTS.slice(0, S.limit).map(r => `
    <article class="ds" data-id="${esc(r.id)}"${S.open===r.id?' aria-current="true"':''}>
      <button type="button" class="tt" data-open="${esc(r.id)}">${hl(r.title, qt)}</button>
      <span class="box">${r.year||''}</span>
      <div class="au">${authorsHtml(r, qt)}</div>
      <div class="meta"><span class="repo"><span class="dot" style="background:${repoVar(r.repo)}"></span>${esc(r.repo)}</span><span class="mono">${esc(r.doi)}</span>${r._new?`<span class="new">${esc(T('isNew'))}</span>`:''}</div>
      ${snippet(r, qt)}
      ${r.kw.length ? `<div class="kws">${r.kw.slice(0, 6).map(k => `<button type="button" class="tag" data-set="kw" data-v="${esc(k)}" aria-pressed="${S.kw===k}">${hl(k, qt)}</button>`).join('')}</div>` : ''}
    </article>`).join('');
  const left = n - S.limit;
  $('more').hidden = left <= 0;
  $('more').textContent = T('showMore')(Math.min(left, 50));
}

/* =====================================================================
   SCHEDA DEL DATASET
   ===================================================================== */
let lastFocus = null;
const linkify = s => s.replace(/(https?:\/\/[^\s<]+[^\s<.,;)])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
function openDetail(id, silent){
  const r = BY_ID[id]; if (!r) return;
  if (!silent && !$('drawer').classList.contains('on')) lastFocus = document.activeElement;
  S.open = id;
  const i = RESULTS.indexOf(r);
  $('dPos').textContent = i >= 0 ? T('pos')(i + 1, RESULTS.length) : '';
  $('dPrev').disabled = i <= 0; $('dNext').disabled = i < 0 || i >= RESULTS.length - 1;
  const long = (r.abstract || '').length > 650;
  const people = r.dais.map(a => {
    const o = r.orcid[a];
    return `<div class="person"><button type="button" class="linkbtn" data-set="au" data-v="${esc(a)}">${esc(a)}</button>${o ? `<a class="orcid" href="https://orcid.org/${esc(o)}" target="_blank" rel="noopener">${esc(o)}</a>` : ''}</div>`;
  }).join('');
  $('dBody').innerHTML = `
    <div>
      <div class="dkick"><span class="repo"><span class="dot" style="background:${repoVar(r.repo)}"></span>${esc(r.repo)}</span><span class="box">${r.year||''}</span>${r._new?`<span class="new">${esc(T('isNew'))}</span>`:''}</div>
      <h2 id="dTitle">${esc(r.title)}</h2>
    </div>
    <div class="dact">
      <a class="primary" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(T('openRepo'))}</a>
      <button type="button" id="cpCite">${esc(T('copyCite'))}</button>
      <button type="button" id="cpBib">${esc(T('copyBib'))}</button>
    </div>
    <div class="dsec"><h3>${esc(T('cite'))}</h3><div class="cite">${linkify(esc(r.cite))}</div></div>
    ${people ? `<div class="dsec"><h3>${esc(T('daisAuthors'))}</h3><div class="dau">${people}</div></div>` : ''}
    <div class="dsec"><h3>${esc(T('abstract'))}</h3>${r.abstract ? `<div class="abstract${long?' clamp':''}" id="abs">${esc(r.abstract)}</div>${long?`<button type="button" class="linkbtn" id="absT">${esc(T('readMore'))}</button>`:''}` : `<p class="note">${esc(T('noAbstract'))}</p>`}</div>
    ${r.kw.length ? `<div class="dsec"><h3>${esc(T('keywords'))}</h3><div class="kws">${r.kw.map(k => `<button type="button" class="tag" data-set="kw" data-v="${esc(k)}" aria-pressed="${S.kw===k}">${esc(k)}</button>`).join('')}</div></div>` : ''}
    <div class="dsec"><h3>${esc(T('ids'))}</h3><dl class="label">
      <dt>${esc(T('doi'))}</dt><dd><a class="mono" href="https://doi.org/${esc(r.doi)}" target="_blank" rel="noopener">${esc(r.doi)}</a></dd>
      ${r.version ? `<dt>${esc(T('curVer'))}</dt><dd>${esc(r.version)}</dd>` : ''}
      ${r.versions.length ? `<dt>${esc(T('related'))}</dt><dd>${r.versions.map(d => `<a class="mono" href="https://doi.org/${esc(d)}" target="_blank" rel="noopener">${esc(d)}</a>`).join('<br>')}</dd>` : ''}
      <dt>${esc(T('id'))}</dt><dd class="mono">${esc(r.id)}</dd>
    </dl></div>`;
  $('cpCite').onclick = () => copy(r.cite);
  $('cpBib').onclick = () => copy(bibtex(r));
  if ($('absT')) $('absT').onclick = () => { const c = $('abs').classList.toggle('clamp'); $('absT').textContent = c ? T('readMore') : T('readLess'); };
  $('drawer').classList.add('on'); $('drawer').setAttribute('aria-hidden', 'false'); $('scrim').classList.add('on');
  $('dBody').scrollTop = 0;
  document.querySelectorAll('.ds[aria-current]').forEach(el => el.removeAttribute('aria-current'));
  const row = document.querySelector(`.ds[data-id="${CSS.escape(id)}"]`); if (row) row.setAttribute('aria-current', 'true');
  if (!silent) $('dClose').focus();
  writeHash();
}
function closeDetail(){
  if (!S.open && !$('drawer').classList.contains('on')) return;
  $('drawer').classList.remove('on'); $('drawer').setAttribute('aria-hidden', 'true'); $('scrim').classList.remove('on');
  document.querySelectorAll('.ds[aria-current]').forEach(el => el.removeAttribute('aria-current'));
  S.open = null; writeHash();
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
function step(d){
  const i = RESULTS.indexOf(BY_ID[S.open]) + d;
  if (i < 0 || i >= RESULTS.length) return;
  if (i >= S.limit) { S.limit = i + 1; renderList(terms(S.q)); }
  openDetail(RESULTS[i].id, true);
}

/* =====================================================================
   ESPORTAZIONI E COPIA
   ===================================================================== */
const bibEsc = s => String(s||'').replace(/([{}&%$#_])/g, '\\$1');
function bibtex(r){
  const first = (r._authors[0] || r.dais[0] || 'dais').split(/[ ,]/)[0];
  const word = (norm(r.title).match(/[a-z]{4,}/) || ['data'])[0];
  const key = norm(first).replace(/[^a-z]/g,'') + (r.year||'') + word;
  const authors = r._authors.map(a => a.includes(',') ? a : a.replace(/^(\S+)\s+(.+)$/, '$1, $2')).join(' and ');
  return `@misc{${key},\n  author    = {${bibEsc(authors)}},\n  title     = {{${bibEsc(r.title)}}},\n  year      = {${r.year||''}},\n  publisher = {${bibEsc(r.repo)}},\n  doi       = {${r.doi}},\n  url       = {${r.url}},\n  note      = {Dataset}\n}`;
}
function download(name, text, mime){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: mime }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast(T('exported')(RESULTS.length));
}
const csvCell = v => { v = String(v==null?'':v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
function exportCsv(){
  const head = ['ID','Anno','Titolo','Repository','DOI','URL','Autori','Autori DAIS','Parole chiave','Citazione'];
  const rows = RESULTS.map(r => [r.id, r.year, r.title, r.repo, r.doi, r.url, r._authors.join('; '), r.dais.join('; '), r.kw.join('; '), r.cite]);
  download('datasets-dais.csv', '\ufeff' + [head, ...rows].map(x => x.map(csvCell).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
}
function exportBib(){ download('datasets-dais.bib', RESULTS.map(bibtex).join('\n\n'), 'application/x-bibtex;charset=utf-8'); }
async function copy(text, msg){
  try { await navigator.clipboard.writeText(text); toast(msg || T('copied')); return; } catch(e) {}
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch(e) {}
  ta.remove(); toast(ok ? (msg || T('copied')) : T('copyFail'), ok ? '' : 'err');
}
function toast(msg, kind){ const el = $('toast'); el.textContent = msg; el.className = 'toast ' + (kind||''); el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, kind === 'err' ? 7000 : 3000); }

/* =====================================================================
   LINK CONDIVISIBILE (#q=…&au=…&ds=…)
   ===================================================================== */
function writeHash(){
  const p = new URLSearchParams();
  if (S.q) p.set('q', S.q);
  if (S.repoOff.size) p.set('xrepo', [...S.repoOff].join('|'));
  if (S.au) p.set('au', S.au);
  if (S.kw) p.set('kw', S.kw);
  if (S.y0 != null) p.set('y', S.y0 + '-' + S.y1);
  if (S.onlyNew) p.set('new', '1');
  if (S.sort !== 'auto') p.set('sort', S.sort);
  if (S.open) p.set('ds', S.open);
  const h = p.toString();
  try { history.replaceState(null, '', h ? '#' + h : location.pathname + location.search); } catch(e) {}
}
function readHash(){
  const p = new URLSearchParams(location.hash.slice(1));
  S.q = p.get('q') || ''; S.repoOff = new Set((p.get('xrepo') || '').split('|').filter(Boolean));
  S.au = p.get('au') || ''; S.kw = p.get('kw') || '';
  const y = (p.get('y') || '').match(/^(\d{4})-(\d{4})$/); S.y0 = y ? +y[1] : null; S.y1 = y ? +y[2] : null;
  S.onlyNew = p.get('new') === '1'; S.sort = p.get('sort') || 'auto'; S.open = p.get('ds');
  $('q').value = S.q;
}

/* =====================================================================
   LINGUA
   ===================================================================== */
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { const v = T(el.dataset.i18n); if (typeof v === 'string') el.textContent = v; });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = T(el.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', T(el.dataset.i18nAria)));
  $('dClose').setAttribute('aria-label', T('close')); $('dPrev').setAttribute('aria-label', T('prev')); $('dNext').setAttribute('aria-label', T('next'));
  $('langBtn').textContent = LANG === 'it' ? 'EN' : 'IT';
  document.title = T('title');
}

/* =====================================================================
   EVENTI
   ===================================================================== */
function refresh(){ S.limit = 50; render(); if (S.open) openDetail(S.open, true); }
function bind(){
  let qT;
  $('filters').addEventListener('submit', e => e.preventDefault());
  $('q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { S.q = e.target.value.trim(); refresh(); }, 160); });
  $('au').addEventListener('change', e => { S.au = e.target.value; refresh(); });
  $('kw').addEventListener('change', e => { S.kw = e.target.value; refresh(); });
  $('fNew').addEventListener('change', e => { S.onlyNew = e.target.checked; refresh(); });
  $('sort').addEventListener('change', e => { S.sort = e.target.value; refresh(); });
  $('fRepo').addEventListener('change', e => { const rp = e.target.dataset.repo; if (!rp) return; e.target.checked ? S.repoOff.delete(rp) : S.repoOff.add(rp); refresh(); });
  const years = () => {
    let a = parseInt($('y0').value, 10), b = parseInt($('y1').value, 10);
    if (isNaN(a) && isNaN(b)) { S.y0 = S.y1 = null; }
    else { a = isNaN(a) ? YMIN : a; b = isNaN(b) ? YMAX : b; S.y0 = Math.max(YMIN, Math.min(a, b)); S.y1 = Math.min(YMAX, Math.max(a, b)); }
    refresh();
  };
  $('y0').addEventListener('change', years); $('y1').addEventListener('change', years);
  $('reset').onclick = () => { S.q = ''; $('q').value = ''; S.repoOff.clear(); S.au = S.kw = ''; S.y0 = S.y1 = null; S.onlyNew = false; S.sort = 'auto'; refresh(); };
  $('expCsv').onclick = exportCsv; $('expBib').onclick = exportBib;
  $('share').onclick = () => { writeHash(); copy(location.href, T('linkCopied')); };
  $('reload').onclick = () => load(true);
  $('more').onclick = () => { S.limit += 50; renderList(terms(S.q)); };
  $('dClose').onclick = closeDetail; $('scrim').onclick = closeDetail;
  $('dPrev').onclick = () => step(-1); $('dNext').onclick = () => step(1);
  $('langBtn').onclick = () => { LANG = LANG === 'it' ? 'en' : 'it'; try { localStorage.setItem('dais-lang', LANG); } catch(e) {} applyLang(); render(); renderStatus(); if (S.open) openDetail(S.open, true); };

  document.addEventListener('click', e => {
    const s = e.target.closest('[data-set]');
    if (s) { const k = s.dataset.set, v = s.dataset.v; S[k] = S[k] === v ? '' : v; refresh(); return; }
    const o = e.target.closest('[data-open]'); if (o) { openDetail(o.dataset.open); return; }
    const row = e.target.closest('.ds'); if (row && !e.target.closest('a,button')) openDetail(row.dataset.id);
  });
  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (e.key === '/' && !typing) { e.preventDefault(); $('q').focus(); $('q').select(); }
    else if (e.key === 'Escape') closeDetail();
    else if (S.open && !typing && e.key === 'ArrowRight') step(1);
    else if (S.open && !typing && e.key === 'ArrowLeft') step(-1);
  });
  window.addEventListener('hashchange', () => { readHash(); render(); if (S.open) openDetail(S.open, true); else if ($('drawer').classList.contains('on')) closeDetail(); });
  setupStrata();
}

applyLang();
bind();
load();
</script>
